<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fish of Fortune - Version Hub</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      width: 100vw;
      height: 100vh;
      background: #0f172a;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .hub-card {
      background: #1e293b;
      border: 2px solid #fbbf24;
      border-radius: 24px;
      padding: 40px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    .hub-icon {
      font-size: 3rem;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 1.8rem;
      color: #fbbf24;
      margin-bottom: 8px;
    }
    p {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-bottom: 28px;
    }
    .version-links {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .version-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 18px 20px;
      text-decoration: none;
      color: #ffffff;
      border-radius: 16px;
      font-weight: 800;
      font-size: 1.05rem;
      transition: transform 0.15s ease, filter 0.2s ease;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
    }
    .version-btn span {
      font-size: 0.75rem;
      font-weight: 400;
      opacity: 0.8;
      margin-top: 4px;
    }
    .version-btn:hover {
      filter: brightness(1.15);
      transform: translateY(-2px);
    }
    .btn-primitive {
      background: linear-gradient(135deg, #475569, #334155);
      border: 1px solid #64748b;
    }
    .btn-polished {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      border: 1px solid #38bdf8;
    }
  </style>
</head>
<body>

  <div class="hub-card">
    <div class="hub-icon">🐟</div>
    <h1>FISH OF FORTUNE</h1>
    <p>Select a version to launch:</p>

    <div class="version-links">
      <a href="/primitive-version/" class="version-btn btn-primitive">
        🧱 Primitive Prototype
        <span>Monolithic main.js structure</span>
      </a>

      <a href="/styled-fof-version/" class="version-btn btn-polished">
        ✨ Modular Architecture
        <span>EventBus, GameState & Scene Classes</span>
      </a>
    </div>
  </div>

</body>
</html>
